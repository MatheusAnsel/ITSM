name: Verificação pós-deploy

# Depois de cada push na main, espera o Render publicar a versão nova e confirma que a demonstração
# responde de ponta a ponta (site da Vercel, repasse de /api, API e banco). Também roda uma vez por dia:
# se o banco gratuito do Render expirar ou a API cair, o aviso aparece aqui antes de um recrutador ver.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

# Um push novo substitui a espera do anterior: só importa a versão mais recente.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes do próprio script
        run: node --test scripts/*.test.mjs
      # O auto-deploy do Render depende do webhook do GitHub, que já deixou commits da main sem deploy.
      # Com o Deploy Hook (Render > itsm-api > Settings > Deploy Hook) salvo no secret RENDER_DEPLOY_HOOK_URL,
      # o próprio workflow pede o deploy. Sem o secret, só avisa e segue dependendo do auto-deploy.
      - name: Pedir deploy ao Render
        if: github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado; dependendo do auto-deploy do Render."
            exit 0
          fi
          curl -fsS -X POST --retry 3 --retry-all-errors "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy solicitado ao Render."
      - name: Demonstração no ar
        env:
          DEMO_URL: ${{ vars.DEMO_URL || 'https://itsm-demo-six.vercel.app' }}
          # Sempre que roda na main (push, agendado ou manual), exige que o commit no ar seja o da main.
          # Antes o agendado só via se a API respondia e ficava verde com uma versão antiga no ar.
          EXPECTED_COMMIT: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
          WAIT_MINUTES: ${{ github.event_name == 'push' && '12' || '4' }}
        run: node scripts/smoke.mjs
