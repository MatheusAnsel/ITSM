name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_ci
          POSTGRES_DB: itsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itsm:itsm_ci@localhost:5432/itsm
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Testes de integração: AppModule inteiro contra o PostgreSQL real do serviço acima.
      - run: npm run db:deploy
      # As políticas de SLA e as categorias vêm do seed, não das migrations; o e2e depende delas.
      - run: npm run db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-only-seed-password-2026
      - name: e2e
        run: |
          set -o pipefail
          npm run test:e2e -w apps/api 2>&1 | tee /tmp/e2e.log
      - name: Resumo da falha do e2e (diagnostico)
        if: failure()
        run: |
          body=$(grep -vE '^\s+at ' /tmp/e2e.log | head -90 | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=e2e::${body}"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run build:web
      - run: npm audit --omit=dev --audit-level=high -w apps/web

  # Garante que as imagens continuam construindo (sem publicar nada).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
