name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_ci
          POSTGRES_DB: itsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itsm:itsm_ci@localhost:5432/itsm
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters-long
      NODE_ENV: test
      # O e2e faz centenas de requisições; o log de acesso só atrapalharia a leitura da saída.
      LOG_REQUESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test scripts/*.test.mjs
      - run: npm run test:cov
      - name: Resumo de cobertura
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const f = 'apps/api/coverage/coverage-summary.json';
          if (!fs.existsSync(f)) process.exit(0);
          const t = JSON.parse(fs.readFileSync(f, 'utf8')).total;
          const row = (k, n) => '| ' + n + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
          const out = ['## Cobertura da API (testes unitários e de serviço)', '', '| Métrica | Cobertura | Linhas cobertas |', '|---|---|---|', row('statements', 'Instruções'), row('branches', 'Ramos'), row('functions', 'Funções'), row('lines', 'Linhas')].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-api
          path: apps/api/coverage
          if-no-files-found: ignore
      # Testes de integração: AppModule inteiro contra o PostgreSQL real do serviço acima.
      - run: npm run db:deploy
      # As políticas de SLA e as categorias vêm do seed, não das migrations; o e2e depende delas.
      - run: npm run db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-only-seed-password-2026
      - run: npm run test:e2e -w apps/api
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run test:web:cov
      - name: Resumo de cobertura
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const f = 'apps/web/coverage/coverage-summary.json';
          if (!fs.existsSync(f)) process.exit(0);
          const t = JSON.parse(fs.readFileSync(f, 'utf8')).total;
          const row = (k, n) => '| ' + n + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
          const out = ['## Cobertura do frontend (lib, hooks e componentes)', '', '| Métrica | Cobertura | Linhas cobertas |', '|---|---|---|', row('statements', 'Instruções'), row('branches', 'Ramos'), row('functions', 'Funções'), row('lines', 'Linhas')].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-web
          path: apps/web/coverage
          if-no-files-found: ignore
      - run: npm run build:web
      - run: npm audit --omit=dev --audit-level=high -w apps/web

  # Navegador real (Chromium) percorrendo os fluxos da demo contra a API, o site e um PostgreSQL de verdade.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_ci
          POSTGRES_DB: itsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itsm:itsm_ci@localhost:5432/itsm
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters-long
      NODE_ENV: test
      PORT: 3001
      # Só em teste automatizado: várias entradas seguidas dos mesmos perfis, todas do mesmo IP.
      RATE_LIMIT_ENABLED: "false"
      AUTO_CLOSE_INTERVAL_MINUTES: "0"
      UPLOAD_DIR: /tmp/itsm-uploads
      SEED_ADMIN_PASSWORD: ci-only-seed-password-2026
      DEMO_PASSWORD: Demo-Itsm-2026
      SEED_DEMO: "true"
      # Valores gravados no build do site: a tela de login em modo demonstração e a URL da API.
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run typecheck:e2e -w apps/web
      - run: npm run test:browser -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  # Garante que as imagens continuam construindo (sem publicar nada).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
